{{/*
NetworkPolicy: restrict ingress to allowedNamespaces only.
No egress restriction -- OpenCode needs outbound access to AI providers.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "opencode.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.server.port }}
          protocol: TCP
        {{- range .Values.networkPolicy.additionalPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
