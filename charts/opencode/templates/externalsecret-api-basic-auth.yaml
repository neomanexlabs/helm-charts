{{/*
ExternalSecret: nginx htpasswd for the machine-only api ingress basic-auth.

Reuses the SAME GCP Secret Manager remote key already mapped for the basic-auth
password (apiIngress.basicAuth.secretKey -> externalSecrets.secrets.data[<key>].key),
pulls the plaintext password, and renders an nginx-compatible htpasswd K8s Secret
(key `auth`, value "<username>:<bcrypt>") using the ESO/Sprig `htpasswd` template
function. No separate GCP secret and no out-of-band htpasswd file are needed.

Gated on apiIngress.enabled AND apiIngress.basicAuth.enabled AND
externalSecrets.enabled (the last provides the GCP SM mapping + ClusterSecretStore).
*/}}
{{- if and .Values.apiIngress.enabled .Values.apiIngress.basicAuth.enabled .Values.externalSecrets.enabled }}
{{- $key := .Values.apiIngress.basicAuth.secretKey }}
{{- $entry := index .Values.externalSecrets.secrets.data $key }}
{{- if not $entry }}
{{- fail (printf "apiIngress.basicAuth.secretKey %q is not present in externalSecrets.secrets.data. Add the GCP Secret Manager mapping there first" $key) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "opencode.apiBasicAuthSecretName" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "opencode.apiBasicAuthSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- /*
        nginx auth-secret format: "<user>:<bcrypt-hash>" under key `auth`.
        The value is an ESO (Sprig) template resolved at sync time:
            {{ htpasswd "<username>" .password }}
        Two-arg Sprig signature (bcrypt by default). ESO 2.0.x does NOT
        support the newer three-arg form with an explicit algorithm.
        Emitted via a YAML block scalar so the inner double-quotes need no escaping.
        */}}
        auth: |-
          {{ printf "{{ htpasswd %q .password }}" .Values.apiIngress.basicAuth.username }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $entry.key }}
{{- end }}
