{{/*
Per-workspace CronJob: periodic git pull for workspace repository, including
all submodules recursively (submodule sync + update --init --recursive --force),
so every submodule is pinned to the gitlink recorded by the freshly pulled root.
Uses "kubectl exec" into the running StatefulSet pod -- NOT a separate pod.
RWO PVCs cannot be shared between StatefulSet and CronJob pods simultaneously.
SSH key is already mounted inside the StatefulSet pod.
*/}}
{{- if .Values.cronJobs.gitSync.enabled }}
{{- range $idx, $ws := .Values.workspaces }}
{{/*
Per-workspace opt-out: gitSync.enabled: false skips this workspace entirely
(no CronJob rendered) — e.g. a live-edit workspace whose checkout must never
be yanked back to the recorded gitlink by the periodic --force update.
dig with default true keeps behavior unchanged when the key is unset.
*/}}
{{- if dig "gitSync" "enabled" true $ws }}
{{- $fullname := include "opencode.fullname" $ }}
{{- $wsFullname := printf "%s-%s" $fullname $ws.name }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $wsFullname }}-git-sync
  labels:
    {{- include "opencode.labels" $ | nindent 4 }}
    opencode.neomanex.com/workspace: {{ $ws.name }}
    app.kubernetes.io/component: git-sync
spec:
  schedule: {{ $.Values.cronJobs.gitSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "opencode.selectorLabels" $ | nindent 12 }}
            opencode.neomanex.com/workspace: {{ $ws.name }}
            app.kubernetes.io/component: git-sync
        spec:
          serviceAccountName: {{ include "opencode.serviceAccountName" $ }}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: git-sync
              image: {{ $.Values.cronJobs.gitSync.image }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  POD="{{ $wsFullname }}-0"
                  NS="{{ $.Release.Namespace }}"
                  echo "Syncing workspace: {{ $ws.name }}"
                  # Sweep debris from a fetch that was killed mid-write (spot
                  # preemption) before fetching again. Same self-heal as the
                  # git-init initContainer -- see statefulset.yaml for why these
                  # two file kinds are fatal in combination. This job fetches
                  # every 6h while the pod may stay up for weeks, so without the
                  # sweep here a corrupt repo stays broken (and every sync fails)
                  # until something happens to restart the pod.
                  kubectl exec "$POD" -n "$NS" -- sh -c 'cd /workspace/{{ $ws.name }} && find .git/objects -name "tmp_pack_*" -type f -delete 2>/dev/null; find .git/objects -type f -size 0 -delete 2>/dev/null; true'
                  kubectl exec "$POD" -n "$NS" -- sh -c 'cd /workspace/{{ $ws.name }} && git fetch origin && git pull --ff-only && git submodule sync --recursive && git submodule update --init --recursive --force'
{{- /*
Autosave: commit + push dirty paths straight from this CronJob, as a backstop
for files an agent writes between its own commits. Configured per workspace via
gitSync.autosave.{enabled,paths,userName,userEmail}; the identity falls back to
the chart-level git.user.*. `gitSync.push: true` is the DEPRECATED alias kept
for one minor release: it means autosave with paths ["places/"] and the
git.user.* identity.
*/}}                  {{- $autosaveOn := dig "gitSync" "autosave" "enabled" false $ws }}
                  {{- $legacyPush := dig "gitSync" "push" false $ws }}
                  {{- if or $autosaveOn $legacyPush }}
                  {{- $autosaveName := dig "gitSync" "autosave" "userName" "" $ws | default $.Values.git.user.name }}
                  {{- $autosaveEmail := dig "gitSync" "autosave" "userEmail" "" $ws | default $.Values.git.user.email }}
                  {{- $autosavePaths := dig "gitSync" "autosave" "paths" (list) $ws }}
                  {{- if not $autosavePaths }}{{ $autosavePaths = list "places/" }}{{ end }}
                  {{- if and $legacyPush (not $autosaveOn) }}
                  # DEPRECATED: gitSync.push, use gitSync.autosave (removed in 1.5.0)
                  {{- end }}
                  echo "Autosave for {{ $ws.name }} (commit + push dirty {{ join " " $autosavePaths }})..."
                  kubectl exec "$POD" -n "$NS" -- sh -c 'cd /workspace/{{ $ws.name }} && git add {{ join " " $autosavePaths }} 2>/dev/null || true; if git diff --cached --quiet 2>/dev/null; then echo "nothing to autosave"; else git -c user.email={{ $autosaveEmail }} -c user.name={{ $autosaveName | quote }} commit -m "chore: autosave $(date -u +%FT%TZ)" && git push origin HEAD || echo "autosave push failed"; fi'
                  {{- end }}
                  echo "Git sync complete for {{ $ws.name }}."
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
{{- end }}
{{- end }}
