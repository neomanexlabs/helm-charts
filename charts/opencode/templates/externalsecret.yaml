{{/*
ExternalSecret 1: opencode-secrets
Provider API keys + server password. Synced from GCP Secret Manager.
Mounted as files at /etc/opencode/secrets/ (for {file:} substitution)
and server-password also used as env var (OPENCODE_SERVER_PASSWORD).
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secrets.secretName }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.secrets.secretName }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $config := .Values.externalSecrets.secrets.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $config.key }}
    {{- end }}
---
{{/*
ExternalSecret 2: opencode-ssh-key
SSH private key for git clone/pull operations.
Mounted at /home/opencode/.ssh/ with defaultMode: 0600.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.sshKey.secretName }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.sshKey.secretName }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $config := .Values.externalSecrets.sshKey.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $config.key }}
    {{- end }}
{{- end }}
