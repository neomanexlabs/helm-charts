{{/*
RoleBinding: binds the exec Role to the chart ServiceAccount.
*/}}
{{- if or .Values.cronJobs.gitSync.enabled .Values.cronJobs.sessionCleanup.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencode.fullname" . }}-exec
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opencode.fullname" . }}-exec
subjects:
  - kind: ServiceAccount
    name: {{ include "opencode.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
