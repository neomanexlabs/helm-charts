{{/*
Per-workspace CronJob: prune old session files from OpenCode data directory.
Uses "kubectl exec" into the running StatefulSet pod -- NOT a separate pod.
RWO PVCs cannot be shared between StatefulSet and CronJob pods simultaneously.
*/}}
{{- if .Values.cronJobs.sessionCleanup.enabled }}
{{- range $idx, $ws := .Values.workspaces }}
{{- $fullname := include "opencode.fullname" $ }}
{{- $wsFullname := printf "%s-%s" $fullname $ws.name }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $wsFullname }}-session-cleanup
  labels:
    {{- include "opencode.labels" $ | nindent 4 }}
    opencode.neomanex.com/workspace: {{ $ws.name }}
    app.kubernetes.io/component: session-cleanup
spec:
  schedule: {{ $.Values.cronJobs.sessionCleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "opencode.selectorLabels" $ | nindent 12 }}
            opencode.neomanex.com/workspace: {{ $ws.name }}
            app.kubernetes.io/component: session-cleanup
        spec:
          serviceAccountName: {{ include "opencode.serviceAccountName" $ }}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: session-cleanup
              image: {{ $.Values.cronJobs.sessionCleanup.image }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  POD="{{ $wsFullname }}-0"
                  NS="{{ $.Release.Namespace }}"
                  DAYS="{{ $.Values.cronJobs.sessionCleanup.retentionDays }}"
                  echo "Cleaning session files older than ${DAYS} days for {{ $ws.name }}..."
                  kubectl exec "$POD" -n "$NS" -- \
                    find /home/opencode/.local/share/opencode/storage \
                    -mtime +"${DAYS}" -type f -delete 2>/dev/null || true
                  echo "Session cleanup complete for {{ $ws.name }}."
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
{{- end }}
