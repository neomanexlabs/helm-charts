apiVersion: v2
name: opencode
description: Runs the OpenCode coding agent as a long-lived service in your cluster, web UI and HTTP API behind your own ingress, one persistent workspace per git repository, with per-workspace config, MCP servers and git sync.

type: application
version: 1.4.10
appVersion: "1.19.0"

keywords:
  - opencode
  - ai-coding-agent
  - kubernetes
  - helm
  - statefulset
  - mcp
  - ai-agents

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/anomalyco/opencode

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: git-init no longer leaks a pack-sized temp file on every pod start. It disables background gc and maintenance (which were killed when the container exited) and sweeps repack temp packs as well as fetch ones, in submodule object stores too.
    - kind: fixed
      description: The git-sync sweep also removes repack temp packs, sparing files under an hour old that a running fetch or repack may still be writing.
    - kind: added
      description: rbac.exposeRole grants read on cert-manager certificates, requests, orders, challenges and events, and patch on certificates/status, so a live-edit script can see why a certificate failed and retry it.
  artifacthub.io/links: |
    - name: Website
      url: https://neomanex.com
    - name: Contact
      url: https://neomanex.com/contact
    - name: Product
      url: https://convops.app
    - name: Source
      url: https://github.com/neomanexlabs/helm-charts
