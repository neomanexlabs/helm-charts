apiVersion: v2
name: opencode
description: Runs the OpenCode coding agent as a long-lived service in your cluster, web UI and HTTP API behind your own ingress, one persistent workspace per git repository, with per-workspace config, MCP servers and git sync.

type: application
version: 1.4.5
appVersion: "1.14.48"

keywords:
  - opencode
  - ai-coding-agent
  - kubernetes
  - helm
  - statefulset
  - mcp
  - ai-agents

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/anomalyco/opencode

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: The chart description and README lead with what the chart is for, running the OpenCode web UI and HTTP API in a cluster so the agent is reachable from any browser
    - kind: added
      description: A section covering what running the agent in a cluster gives you, including the CORS setting a publicly exposed web UI needs
