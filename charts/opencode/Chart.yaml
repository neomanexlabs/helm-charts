apiVersion: v2
name: opencode
description: Runs the OpenCode coding agent as a long-lived service in your cluster, web UI and HTTP API behind your own ingress, one persistent workspace per git repository, with per-workspace config, MCP servers and git sync.

type: application
version: 1.4.11
appVersion: "1.19.0"

keywords:
  - opencode
  - ai-coding-agent
  - kubernetes
  - helm
  - statefulset
  - mcp
  - ai-agents

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/anomalyco/opencode

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: workspaces[].enabled turns a single workspace off without deleting its data. A disabled workspace renders no StatefulSet, Services, Ingresses, ConfigMap or CronJobs, and its PersistentVolumeClaims are kept for when it is turned back on.
