apiVersion: v2
name: opencode
description: Runs the OpenCode coding agent as a long-lived service in your cluster, web UI and HTTP API behind your own ingress, one persistent workspace per git repository, with per-workspace config, MCP servers and git sync.

type: application
version: 1.4.6
appVersion: "1.19.0"

keywords:
  - opencode
  - ai-coding-agent
  - kubernetes
  - helm
  - statefulset
  - mcp
  - ai-agents

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/anomalyco/opencode

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: config.enabledProviders and workspaces[].enabledProviders render OpenCode enabled_providers, so a workspace loads only the providers you list
    - kind: added
      description: Per-provider whitelist and blacklist, globally on config.providers and per workspace through workspaces[].providerModels, limit which models the model picker shows
    - kind: changed
      description: The default image moves to OpenCode 1.19.0
  artifacthub.io/links: |
    - name: Website
      url: https://neomanex.com
    - name: Contact
      url: https://neomanex.com/contact
    - name: Product
      url: https://convops.app
    - name: Source
      url: https://github.com/neomanexlabs/helm-charts
