apiVersion: v2
name: opencode
description: Runs the OpenCode coding agent as a long-lived service in your cluster, web UI and HTTP API behind your own ingress, one persistent workspace per git repository, with per-workspace config, MCP servers and git sync.

type: application
version: 1.4.9
appVersion: "1.19.0"

keywords:
  - opencode
  - ai-coding-agent
  - kubernetes
  - helm
  - statefulset
  - mcp
  - ai-agents

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/anomalyco/opencode

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Default image.tag moves to the immutable 1.19.0-2 build (kubectl 1.36.5, scanned with Trivy before publish).
    - kind: added
      description: README documents image versions and tag grammar, digest pinning, per-workspace image tags, release-wide providers and config-driven restarts.
