{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- /*
Password resolution, in order:

  1. auth.password (or global.redis.password) when either is set.
  2. the value already stored in this release's Secret. `lookup` reads the live
     cluster, so an upgrade keeps the password the running pods authenticate
     with instead of rotating it underneath them. During `helm template` and
     any other render without cluster access `lookup` returns nothing, so a
     dry run shows a fresh random value rather than the stored one.
  3. a new 32 character random string, which is the first install path.

The same three steps run for the Sentinel password.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "redis.fullname" .) }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{- $existingData = $existing.data }}
{{- end }}
{{- $password := include "redis.password" . }}
{{- if not $password }}
{{- $stored := index $existingData "redis-password" }}
{{- if $stored }}
{{- $password = b64dec $stored }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $sentinelPassword := .Values.auth.sentinelPassword }}
{{- if not $sentinelPassword }}
{{- $storedSentinel := index $existingData "redis-sentinel-password" }}
{{- if $storedSentinel }}
{{- $sentinelPassword = b64dec $storedSentinel }}
{{- else }}
{{- $sentinelPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "redis.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ $password | b64enc | quote }}
  {{- if and .Values.sentinel.enabled .Values.auth.sentinel }}
  redis-sentinel-password: {{ $sentinelPassword | b64enc | quote }}
  {{- end }}
{{- end }}
