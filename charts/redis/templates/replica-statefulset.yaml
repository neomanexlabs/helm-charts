{{- if and (eq .Values.architecture "replication") (gt (.Values.replica.replicaCount | int) 0) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.replica.statefulsetName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "redis.labels" . | nindent 4 }}
    app.kubernetes.io/component: replica
    {{- if .Values.replica.podLabels }}
    {{- toYaml .Values.replica.podLabels | nindent 4 }}
    {{- end }}
  {{- if .Values.replica.podAnnotations }}
  annotations: {{- toYaml .Values.replica.podAnnotations | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "redis.headless.serviceName" . }}
  replicas: {{ .Values.replica.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "redis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: replica
  template:
    metadata:
      labels: {{- include "redis.labels" . | nindent 8 }}
        app.kubernetes.io/component: replica
        {{- if .Values.replica.podLabels }}
        {{- toYaml .Values.replica.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/scripts: {{ include (print $.Template.BasePath "/scripts-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.replica.podAnnotations }}
        {{- toYaml .Values.replica.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      {{- include "redis.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "redis.serviceAccountName" . }}
      {{- if .Values.replica.priorityClassName }}
      priorityClassName: {{ .Values.replica.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.replica.affinity }}
      affinity: {{- toYaml .Values.replica.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {{- include "redis.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: replica
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if .Values.replica.nodeSelector }}
      nodeSelector: {{- toYaml .Values.replica.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.replica.tolerations }}
      tolerations: {{- toYaml .Values.replica.tolerations | nindent 8 }}
      {{- end }}
      {{- with .Values.replica.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.replica.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.replica.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if or .Values.replica.initContainers .Values.sysctl.enabled .Values.volumePermissions.enabled }}
      initContainers:
        {{- if .Values.volumePermissions.enabled }}
        - name: volume-permissions
          image: {{ .Values.volumePermissions.image.registry }}/{{ .Values.volumePermissions.image.repository }}:{{ .Values.volumePermissions.image.tag }}
          imagePullPolicy: {{ .Values.volumePermissions.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              chown -R 1001:1001 /data
              chmod -R 755 /data
          securityContext:
            runAsUser: 0
          resources: {{- toYaml .Values.volumePermissions.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}
        {{- if .Values.sysctl.enabled }}
        - name: init-sysctl
          image: {{ .Values.sysctl.image.registry }}/{{ .Values.sysctl.image.repository }}:{{ .Values.sysctl.image.tag }}
          imagePullPolicy: {{ .Values.sysctl.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              {{- range $key, $value := .Values.sysctl.sysctls }}
              sysctl -w {{ $key }}={{ $value }}
              {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
          resources: {{- toYaml .Values.sysctl.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.replica.initContainers }}
        {{- toYaml .Values.replica.initContainers | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "redis.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.replica.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.replica.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.replica.command }}
          command: {{- toYaml .Values.replica.command | nindent 12 }}
          {{- else }}
          command:
            - /bin/sh
            - /opt/redis/scripts/start-replica.sh
          {{- end }}
          env:
            - name: REDIS_REPLICATION_MODE
              value: replica
            {{- if .Values.replica.extraEnvVars }}
            {{- toYaml .Values.replica.extraEnvVars | nindent 12 }}
            {{- end }}
          {{- if or .Values.replica.extraEnvVarsCM .Values.replica.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.replica.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.replica.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.replica.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.replica.extraEnvVarsSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ include "redis.containerPort" . }}
              protocol: TCP
          {{- if .Values.replica.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.replica.customLivenessProbe }}
            {{- toYaml .Values.replica.customLivenessProbe | nindent 12 }}
            {{- else }}
            exec:
              command:
                - sh
                - -c
                - |
                  {{- if (include "redis.auth.enabled" .) }}
                  redis-cli -a "$( cat /opt/redis/password/redis-password )" ping | grep -q PONG
                  {{- else }}
                  redis-cli ping | grep -q PONG
                  {{- end }}
            initialDelaySeconds: {{ .Values.replica.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.replica.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.replica.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.replica.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.replica.livenessProbe.failureThreshold }}
            {{- end }}
          {{- end }}
          {{- if .Values.replica.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.replica.customReadinessProbe }}
            {{- toYaml .Values.replica.customReadinessProbe | nindent 12 }}
            {{- else }}
            exec:
              command:
                - sh
                - /opt/redis/scripts/ping-readiness.sh
            initialDelaySeconds: {{ .Values.replica.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.replica.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.replica.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.replica.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.replica.readinessProbe.failureThreshold }}
            {{- end }}
          {{- end }}
          {{- if .Values.replica.startupProbe.enabled }}
          startupProbe:
            {{- if .Values.replica.customStartupProbe }}
            {{- toYaml .Values.replica.customStartupProbe | nindent 12 }}
            {{- else }}
            exec:
              command:
                - sh
                - -c
                - |
                  {{- if (include "redis.auth.enabled" .) }}
                  redis-cli -a "$( cat /opt/redis/password/redis-password )" ping | grep -q PONG
                  {{- else }}
                  redis-cli ping | grep -q PONG
                  {{- end }}
            initialDelaySeconds: {{ .Values.replica.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.replica.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.replica.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.replica.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.replica.startupProbe.failureThreshold }}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.replica.resources | nindent 12 }}
          {{- if .Values.replica.lifecycleHooks }}
          lifecycle: {{- toYaml .Values.replica.lifecycleHooks | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /opt/redis/redis.conf
              subPath: redis.conf
            - name: scripts
              mountPath: /opt/redis/scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if (include "redis.auth.enabled" .) }}
            - name: redis-password
              mountPath: /opt/redis/password
              readOnly: true
            {{- end }}
            {{- if .Values.replica.extraVolumeMounts }}
            {{- toYaml .Values.replica.extraVolumeMounts | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ include "redis.metrics.image" . }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              {{- if (include "redis.auth.enabled" .) }}
              export REDIS_PASSWORD="$( cat /opt/redis/password/redis-password )"
              /redis_exporter \
                --redis.addr=localhost:{{ include "redis.containerPort" . }} \
                --redis.password="${REDIS_PASSWORD}" \
                {{- range .Values.metrics.extraArgs }}
                {{ . }} \
                {{- end }}
              {{- else }}
              /redis_exporter \
                --redis.addr=localhost:{{ include "redis.containerPort" . }} \
                {{- range .Values.metrics.extraArgs }}
                {{ . }} \
                {{- end }}
              {{- end }}
          ports:
            - name: metrics
              containerPort: {{ include "redis.metrics.containerPort" . }}
              protocol: TCP
          resources: {{- toYaml .Values.metrics.resources | nindent 12 }}
          {{- if (include "redis.auth.enabled" .) }}
          volumeMounts:
            - name: redis-password
              mountPath: /opt/redis/password
              readOnly: true
          {{- end }}
        {{- end }}
        {{- if .Values.replica.sidecars }}
        {{- toYaml .Values.replica.sidecars | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "redis.configmapName" . }}
            defaultMode: 0644
        - name: scripts
          configMap:
            name: {{ include "redis.scripts.configmapName" . }}
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
        {{- if (include "redis.auth.enabled" .) }}
        - name: redis-password
          secret:
            secretName: {{ include "redis.secretName" . }}
            items:
              - key: {{ include "redis.secretPasswordKey" . }}
                path: redis-password
              {{- if and .Values.sentinel.enabled .Values.auth.sentinel }}
              - key: {{ include "redis.secretSentinelPasswordKey" . }}
                path: redis-sentinel-password
              {{- end }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.replica.extraVolumes }}
        {{- toYaml .Values.replica.extraVolumes | nindent 8 }}
        {{- end }}
  {{- if .Values.replica.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- if .Values.replica.persistence.annotations }}
        annotations: {{- toYaml .Values.replica.persistence.annotations | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- range .Values.replica.persistence.accessModes }}
          - {{ . | quote }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.replica.persistence.size | quote }}
        {{- if or .Values.replica.persistence.storageClass (include "redis.storageClass" .) }}
        storageClassName: {{ default (include "redis.storageClass" .) .Values.replica.persistence.storageClass | quote }}
        {{- end }}
        {{- if .Values.replica.persistence.selector }}
        selector: {{- toYaml .Values.replica.persistence.selector | nindent 10 }}
        {{- end }}
        {{- if .Values.replica.persistence.dataSource }}
        dataSource: {{- toYaml .Values.replica.persistence.dataSource | nindent 10 }}
        {{- end }}
  {{- else }}
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
