{{/*
================================================================================
External Secrets for Redis HA Cluster
================================================================================
Integrates with External Secrets Operator for secure secret management.
Syncs Redis and Sentinel passwords from GCP Secret Manager.
*/}}
{{- if .Values.externalSecrets.enabled }}

{{/*
--------------------------------------------------------------------------------
ClusterSecretStore Reference (uses existing cluster-wide store)
--------------------------------------------------------------------------------
*/}}

{{/*
--------------------------------------------------------------------------------
ExternalSecret for Redis Credentials
--------------------------------------------------------------------------------
Creates the Kubernetes secret that Redis pods will use for authentication.
*/}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "redis.fullname" . }}-credentials-es
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "6h" }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name | default "cluster-secret-store" }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "ClusterSecretStore" }}

  target:
    name: {{ .Values.auth.existingSecret | default (printf "%s-credentials" (include "redis.fullname" .)) }}
    creationPolicy: Owner

  data:
    # Redis master password
    - secretKey: {{ .Values.auth.existingSecretPasswordKey | default "redis-password" }}
      remoteRef:
        key: {{ .Values.externalSecrets.redisPasswordSecret.key }}
        {{- with .Values.externalSecrets.redisPasswordSecret.property }}
        property: {{ . }}
        {{- end }}

    {{- if and .Values.sentinel.enabled .Values.auth.sentinel }}
    # Redis Sentinel password
    - secretKey: {{ .Values.auth.existingSecretSentinelPasswordKey | default "redis-sentinel-password" }}
      remoteRef:
        key: {{ .Values.externalSecrets.sentinelPasswordSecret.key }}
        {{- with .Values.externalSecrets.sentinelPasswordSecret.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}

{{- end }}
