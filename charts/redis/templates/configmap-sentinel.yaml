{{- if and (eq .Values.architecture "replication") .Values.sentinel.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.sentinel.configmapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "redis.labels" . | nindent 4 }}
    app.kubernetes.io/component: sentinel
data:
  sentinel.conf: |
    # Redis Sentinel configuration
    # Auto-generated by Helm chart

    # Sentinel port
    port 26379

    # Working directory
    dir /data

    # Master monitoring configuration
    # sentinel monitor <master-name> <ip> <port> <quorum>
    sentinel monitor {{ .Values.sentinel.masterSet }} {{ include "redis.fullname" . }}-master-0.{{ include "redis.headless.serviceName" . }}.{{ .Release.Namespace }}.svc.cluster.local 6379 {{ .Values.sentinel.quorum }}

    # Failover parameters
    # Time in milliseconds for a master to be considered down
    sentinel down-after-milliseconds {{ .Values.sentinel.masterSet }} {{ .Values.sentinel.downAfterMilliseconds }}

    # Maximum time for a failover to complete
    sentinel failover-timeout {{ .Values.sentinel.masterSet }} {{ .Values.sentinel.failoverTimeout }}

    # Number of replicas to reconfigure simultaneously during failover
    sentinel parallel-syncs {{ .Values.sentinel.masterSet }} {{ .Values.sentinel.parallelSyncs }}

    {{- if (include "redis.auth.enabled" .) }}
    # Redis master authentication
    sentinel auth-pass {{ .Values.sentinel.masterSet }} REDIS_PASSWORD_PLACEHOLDER

    {{- if .Values.auth.sentinel }}
    # Sentinel authentication
    requirepass SENTINEL_PASSWORD_PLACEHOLDER
    {{- end }}
    {{- end }}

    # Announce configuration for Kubernetes
    # This enables hostname resolution for proper service discovery
    sentinel announce-hostnames yes
    sentinel resolve-hostnames yes

    # Deny scripts for security
    sentinel deny-scripts-reconfig yes

    # Log level
    loglevel notice
{{- end }}
