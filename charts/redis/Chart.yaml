apiVersion: v2
name: redis
description: Runs Redis on Kubernetes with Sentinel high availability, automatic failback of the master role, and role-aware readiness so the master Service always points at a node that accepts writes.

type: application
version: 1.1.0
appVersion: "7.4.2"

keywords:
  - redis
  - sentinel
  - high-availability
  - failover
  - cache
  - key-value
  - kubernetes
  - helm

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/redis/redis

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: added
      description: External Secrets Operator settings are declared in values, so the chart installs with defaults on a cluster that has neither the operator nor a Prometheus Operator
    - kind: added
      description: Passwords are generated on first install and reused on upgrade when none is supplied, so no well known credential ships as a default
    - kind: added
      description: Topology spread constraints render on the master, replica and Sentinel workloads
    - kind: changed
      description: The Sentinel bootstrap waits for every replica instead of a fixed pair
    - kind: removed
      description: Values that no template rendered are gone, so the values reference lists only what the chart implements
  artifacthub.io/links: |
    - name: Website
      url: https://neomanex.com
    - name: Contact
      url: https://neomanex.com/contact
    - name: ConvOps
      url: https://convops.app
    - name: Gnosari
      url: https://gnosari.com
    - name: Source
      url: https://github.com/neomanexlabs/helm-charts
    - name: Redis documentation
      url: https://redis.io/docs/latest/
  artifacthub.io/images: |
    - name: redis
      image: redis:7.4.2-alpine
    - name: redis-exporter
      image: oliver006/redis_exporter:v1.62.0-alpine
