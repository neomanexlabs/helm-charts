{{/*
================================================================================
External Secrets for CloudNativePG Cluster
================================================================================
Integrates with External Secrets Operator for secure secret management.
Supports: GCP Secret Manager, AWS Secrets Manager, Azure Key Vault, Vault
*/}}
{{- if .Values.externalSecrets.enabled }}

{{/*
--------------------------------------------------------------------------------
SecretStore (if not using an existing one)
--------------------------------------------------------------------------------
*/}}
{{- if not .Values.externalSecrets.secretStore.name }}
{{- $provider := .Values.externalSecrets.provider }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "cnpg-cluster.fullname" . }}-secret-store
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-store
spec:
  {{- if eq $provider "gcpsm" }}
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.gcp.projectID | required "externalSecrets.gcp.projectID is required for GCP provider" }}
      {{- if .Values.externalSecrets.gcp.auth }}
      auth:
        {{- if .Values.externalSecrets.gcp.auth.workloadIdentity }}
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecrets.gcp.auth.workloadIdentity.clusterLocation | required "Cluster location required for Workload Identity" }}
          clusterName: {{ .Values.externalSecrets.gcp.auth.workloadIdentity.clusterName | required "Cluster name required for Workload Identity" }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.gcp.auth.workloadIdentity.serviceAccountName | required "Service account name required for Workload Identity" }}
        {{- else if .Values.externalSecrets.gcp.auth.secretRef }}
        secretRef:
          secretAccessKeySecretRef:
            name: {{ .Values.externalSecrets.gcp.auth.secretRef.name }}
            key: {{ .Values.externalSecrets.gcp.auth.secretRef.key | default "secret-access-credentials" }}
        {{- end }}
      {{- end }}

  {{- else if eq $provider "aws" }}
  provider:
    aws:
      service: {{ .Values.externalSecrets.aws.service | default "SecretsManager" }}
      region: {{ .Values.externalSecrets.aws.region | required "AWS region is required" }}
      {{- with .Values.externalSecrets.aws.role }}
      role: {{ . }}
      {{- end }}
      auth:
        {{- if .Values.externalSecrets.aws.auth.jwt }}
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.aws.auth.jwt.serviceAccountName | required "Service account name required for JWT auth" }}
        {{- else if .Values.externalSecrets.aws.auth.secretRef }}
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.externalSecrets.aws.auth.secretRef.name }}
            key: {{ .Values.externalSecrets.aws.auth.secretRef.accessKeyIDKey | default "access-key-id" }}
          secretAccessKeySecretRef:
            name: {{ .Values.externalSecrets.aws.auth.secretRef.name }}
            key: {{ .Values.externalSecrets.aws.auth.secretRef.secretAccessKeyKey | default "secret-access-key" }}
        {{- end }}

  {{- else if eq $provider "vault" }}
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | required "Vault server is required" }}
      path: {{ .Values.externalSecrets.vault.path | default "secret" }}
      version: {{ .Values.externalSecrets.vault.version | default "v2" }}
      auth:
        {{- if .Values.externalSecrets.vault.auth.kubernetes }}
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vault.auth.kubernetes.mountPath | default "kubernetes" }}
          role: {{ .Values.externalSecrets.vault.auth.kubernetes.role | required "Vault role required" }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.vault.auth.kubernetes.serviceAccountName | required "Service account name required" }}
        {{- end }}

  {{- else if eq $provider "azurekv" }}
  provider:
    azurekv:
      vaultUrl: {{ .Values.externalSecrets.azure.vaultUrl | required "Azure Key Vault URL is required" }}
      {{- with .Values.externalSecrets.azure.tenantId }}
      tenantId: {{ . }}
      {{- end }}
      auth:
        {{- if .Values.externalSecrets.azure.auth.managedIdentity }}
        managedIdentity:
          identityId: {{ .Values.externalSecrets.azure.auth.managedIdentity.identityId | required "Identity ID required" }}
        {{- end }}

  {{- else if not $provider }}
  {{- fail "externalSecrets.provider is required when externalSecrets.enabled is true and no secretStore.name is set. Use one of: gcpsm, aws, vault, azurekv" }}
  {{- else }}
  {{- fail (printf "Unsupported provider '%s'. Must be one of: gcpsm, aws, vault, azurekv" $provider) }}
  {{- end }}
{{- end }}

{{/*
--------------------------------------------------------------------------------
ExternalSecret for Superuser Credentials
--------------------------------------------------------------------------------
*/}}
{{- if and .Values.auth.superuser.enabled .Values.externalSecrets.superuserSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cnpg-cluster.clusterName" . }}-superuser-es
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "6h" }}

  secretStoreRef:
    {{- if .Values.externalSecrets.secretStore.name }}
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}
    {{- else }}
    name: {{ include "cnpg-cluster.fullname" . }}-secret-store
    kind: SecretStore
    {{- end }}

  target:
    name: {{ include "cnpg-cluster.superuserSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ `{{ .password }}` }}"

  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.superuserSecret.key }}
        {{- with .Values.externalSecrets.superuserSecret.property }}
        property: {{ . }}
        {{- end }}
{{- end }}

{{/*
--------------------------------------------------------------------------------
ExternalSecret for Application User Credentials
--------------------------------------------------------------------------------
*/}}
{{- if and .Values.auth.appUser.enabled .Values.externalSecrets.appUserSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cnpg-cluster.clusterName" . }}-app-user-es
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "6h" }}

  secretStoreRef:
    {{- if .Values.externalSecrets.secretStore.name }}
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}
    {{- else }}
    name: {{ include "cnpg-cluster.fullname" . }}-secret-store
    kind: SecretStore
    {{- end }}

  target:
    name: {{ include "cnpg-cluster.appUserSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.auth.appUser.username | default "app" }}
        password: "{{ `{{ .password }}` }}"

  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.appUserSecret.key }}
        {{- with .Values.externalSecrets.appUserSecret.property }}
        property: {{ . }}
        {{- end }}
{{- end }}

{{- end }}
