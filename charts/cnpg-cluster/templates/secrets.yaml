{{/*
================================================================================
Secrets for CloudNativePG Cluster
================================================================================
Creates secrets for:
- Superuser credentials
- Application user credentials
- Backup credentials (for S3/Azure when not using Workload Identity)
*/}}

{{/*
--------------------------------------------------------------------------------
Superuser Secret
--------------------------------------------------------------------------------
*/}}
{{- if and .Values.auth.superuser.enabled (not .Values.auth.superuser.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- if .Values.auth.superuser.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnpg-cluster.superuserSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
  {{- with (include "cnpg-cluster.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
data:
  username: {{ "postgres" | b64enc }}
  password: {{ .Values.auth.superuser.password | b64enc }}
{{- end }}
{{- end }}
---
{{/*
--------------------------------------------------------------------------------
Application User Secret
--------------------------------------------------------------------------------
*/}}
{{- if and .Values.auth.appUser.enabled (not .Values.auth.appUser.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- if .Values.auth.appUser.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnpg-cluster.appUserSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
  {{- with (include "cnpg-cluster.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.auth.appUser.username | default "app" | b64enc }}
  password: {{ .Values.auth.appUser.password | b64enc }}
{{- end }}
{{- end }}
---
{{/*
--------------------------------------------------------------------------------
Backup Credentials Secret (for S3/Azure - not needed for GCS with Workload Identity)
--------------------------------------------------------------------------------
*/}}
{{- if and .Values.backup.enabled .Values.backup.credentials.createSecret }}
{{- if or (eq .Values.backup.provider "s3") (and (eq .Values.backup.provider "azure") (not .Values.backup.azure.inheritFromAzureAD)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnpg-cluster.backupSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with (include "cnpg-cluster.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if eq .Values.backup.provider "s3" }}
  ACCESS_KEY_ID: {{ .Values.backup.s3.credentials.accessKeyId | required "backup.s3.credentials.accessKeyId is required" | b64enc }}
  ACCESS_SECRET_KEY: {{ .Values.backup.s3.credentials.secretAccessKey | required "backup.s3.credentials.secretAccessKey is required" | b64enc }}
  {{- with .Values.backup.s3.region }}
  AWS_REGION: {{ . | b64enc }}
  {{- end }}
  {{- else if eq .Values.backup.provider "azure" }}
  AZURE_CONNECTION_STRING: {{ .Values.backup.azure.credentials.connectionString | required "backup.azure.credentials.connectionString is required" | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
