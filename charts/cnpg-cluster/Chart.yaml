apiVersion: v2
name: cnpg-cluster
description: Runs a CloudNativePG PostgreSQL cluster on Kubernetes, tuned to stay available on spot and preemptible nodes, with backups, PgBouncer pooling and automatic recovery of stuck replicas.

type: application
version: 1.1.0
appVersion: "1.29.1"
kubeVersion: ">=1.25.0-0"

keywords:
  - postgresql
  - postgres
  - cloudnative-pg
  - cnpg
  - high-availability
  - spot-instances
  - pgbouncer
  - backup

home: https://neomanex.com

sources:
  - https://github.com/neomanexlabs/helm-charts
  - https://github.com/cloudnative-pg/cloudnative-pg

maintainers:
  - name: Neomanex
    url: https://neomanex.com/contact

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: database
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: backup.method plugin moves backups to the Barman Cloud Plugin. The chart renders an ObjectStore with the destination, credentials and retention, points the Cluster at it as WAL archiver, and switches the ScheduledBackup to the plugin method
    - kind: added
      description: backup.plugin values for the ObjectStore name, the server name and the instance sidecar configuration
    - kind: changed
      description: The default stays barmanObjectStore and renders the same Cluster as 1.0.0
  artifacthub.io/links: |
    - name: Website
      url: https://neomanex.com
    - name: Contact
      url: https://neomanex.com/contact
    - name: ConvOps
      url: https://convops.app
    - name: Gnosari
      url: https://gnosari.com
    - name: Source
      url: https://github.com/neomanexlabs/helm-charts
    - name: CloudNativePG documentation
      url: https://cloudnative-pg.io/documentation/current/
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/cloudnative-pg/postgresql:17
    - name: recovery
      image: alpine/k8s:1.33.5
