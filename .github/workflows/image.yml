# Build and publish the public OpenCode container image to GHCR.
#
# Tag grammar: opencode-v<upstream>-<n>
#   <upstream> = the upstream ghcr.io/anomalyco/opencode version
#   <n>        = rebuild counter for the same upstream version
# The image is pushed as :<upstream>-<n> and as the floating alias :<upstream>.
#
# Every build is scanned with Trivy BEFORE anything is pushed: a CRITICAL or
# HIGH finding that has a fix fails the job and nothing reaches the registry.
# Reviewed exceptions live in images/opencode/.trivyignore, each with a dated
# re-check. Pull requests that touch the image run the same build and scan
# (for the chart's appVersion) without pushing.
name: image

on:
  push:
    tags:
      - 'opencode-v*'
  pull_request:
    paths:
      - 'images/opencode/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build, in the form opencode-v<upstream>-<n>'
        required: true
        type: string

permissions: {}

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive image tag and upstream version
        id: version
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Derive "<image_tag> <upstream_version>" from an opencode-v* git tag.
          # Only a trailing rebuild counter (-<digits>) is stripped, so
          # opencode-v1.14.48-1 -> "1.14.48-1 1.14.48" and
          # opencode-v1.14.48   -> "1.14.48 1.14.48".
          derive() {
            tag="$1"
            case "$tag" in
              opencode-v*) ;;
              *) echo "tag '$tag' does not match opencode-v*" >&2; return 1 ;;
            esac
            image_tag="${tag#opencode-v}"
            case "$image_tag" in
              *-[0-9]|*-[0-9][0-9]|*-[0-9][0-9][0-9]) upstream="${image_tag%-*}" ;;
              *) upstream="$image_tag" ;;
            esac
            printf '%s %s\n' "$image_tag" "$upstream"
          }

          # Self-test the derivation before trusting it.
          got="$(derive opencode-v1.14.48-1)"
          [ "$got" = "1.14.48-1 1.14.48" ] || { echo "self-test failed for opencode-v1.14.48-1: '$got'" >&2; exit 1; }
          got="$(derive opencode-v1.14.48)"
          [ "$got" = "1.14.48 1.14.48" ] || { echo "self-test failed for opencode-v1.14.48: '$got'" >&2; exit 1; }
          echo "derivation self-test passed"

          # A pull request has no release tag: build the upstream version the
          # chart currently ships (its appVersion) under a throwaway tag.
          if [ "$EVENT" = "pull_request" ]; then
            app_version="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/opencode/Chart.yaml)"
            [ -n "$app_version" ] || { echo "appVersion not found in charts/opencode/Chart.yaml" >&2; exit 1; }
            RAW_TAG="opencode-v${app_version}-0"
          fi
          # shellcheck disable=SC2046
          set -- $(derive "$RAW_TAG")
          IMAGE_TAG="$1"
          OPENCODE_VERSION="$2"
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "OPENCODE_VERSION=$OPENCODE_VERSION"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "opencode_version=$OPENCODE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/neomanexlabs/opencode
          tags: |
            type=raw,value=${{ steps.version.outputs.image_tag }}
            type=raw,value=${{ steps.version.outputs.opencode_version }}
          labels: |
            org.opencontainers.image.title=opencode
            org.opencontainers.image.vendor=Neomanex
            org.opencontainers.image.url=https://neomanex.com
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/opencode
          platforms: linux/amd64
          # Load into the local daemon only. The scan below decides whether
          # anything is pushed.
          load: true
          push: false
          provenance: false
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.opencode_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan (Trivy, before push)
        env:
          IMAGE: ghcr.io/neomanexlabs/opencode:${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          # Trivy runs from its release image, pinned by digest. It reads the
          # freshly built image from the local daemon.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/images/opencode/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 --no-progress "$IMAGE"

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"
