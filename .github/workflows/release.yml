# Chart release: GitHub Release + Pages index (chart-releaser), then the SAME
# package file pushed to GHCR as an OCI artifact. The chart is packaged once,
# by chart-releaser; the OCI push reuses that .tgz byte for byte, so the
# release asset and the OCI layer carry the same checksum.
#
# A chart edit that reaches main without a Chart.yaml version bump fails at the
# version-collision guard, on purpose: a published version is immutable because
# consumers pin it by exact version.
name: release

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions: {}

env:
  OCI_REGISTRY: oci://ghcr.io/neomanexlabs/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure git identity for chart-releaser
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs BEFORE chart-releaser so an un-bumped chart edit fails the whole
      # workflow rather than half-publishing a GitHub Release first.
      # A version that is already published is allowed through only when the
      # chart directory is byte-identical to the tree the release tag points
      # at (a re-run or a history rewrite with the same content); then there
      # is nothing to release and the later steps are skipped.
      - name: Version-collision guard
        id: guard
        run: |
          set -euo pipefail
          rc=0
          pending=0
          for chart in charts/*/; do
            name="$(helm show chart "$chart" | awk '$1 == "name:" { print $2; exit }')"
            version="$(helm show chart "$chart" | awk '$1 == "version:" { print $2; exit }')"
            echo "checking $name $version"
            if helm show chart "${OCI_REGISTRY}/${name}" --version "$version" >/dev/null 2>&1; then
              tag="${name}-${version}"
              released_tree="$(git rev-parse --verify --quiet "refs/tags/${tag}:charts/${name}" || true)"
              current_tree="$(git rev-parse "HEAD:charts/${name}")"
              if [ -n "$released_tree" ] && [ "$released_tree" = "$current_tree" ]; then
                echo "$name $version is already published and charts/$name is identical to tag $tag: nothing to release"
              else
                echo "::error::$name $version is ALREADY published at ${OCI_REGISTRY} with different content. Bump Chart.yaml version."
                rc=1
              fi
            else
              pending=1
            fi
          done
          echo "release=$([ "$pending" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Run chart-releaser
        if: steps.guard.outputs.release == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          config: cr.yaml
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chart-releaser leaves its packages in .cr-release-packages; push those
      # exact files. Never run helm package a second time here.
      # A chart whose version is already on GHCR was released by an earlier
      # run and is skipped. A chart with a GitHub Release but no OCI copy
      # (a run that failed between the two publishes) is pushed from the
      # release asset, which is the same .tgz chart-releaser uploaded.
      - name: Push the released package to GHCR
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            name="$(helm show chart "$chart" | awk '$1 == "name:" { print $2; exit }')"
            version="$(helm show chart "$chart" | awk '$1 == "version:" { print $2; exit }')"
            if helm show chart "${OCI_REGISTRY}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "$name $version is already on ${OCI_REGISTRY}: skipping"
              continue
            fi
            pkg=".cr-release-packages/${name}-${version}.tgz"
            if [ ! -f "$pkg" ]; then
              echo "$pkg not packaged in this run: fetching the release asset ${name}-${version}"
              gh release download "${name}-${version}" --pattern "${name}-${version}.tgz" --dir .cr-release-packages
            fi
            if [ ! -f "$pkg" ]; then
              echo "::error::$pkg not found: no package from chart-releaser and no release asset for ${name} ${version}"
              exit 1
            fi
            echo "sha256 $(sha256sum "$pkg")"
            helm push "$pkg" "$OCI_REGISTRY"
            echo "pushed ${name} ${version} to ${OCI_REGISTRY} from ${pkg}"
          done
