# Chart pull-request gate: lint, render, docs sync, identifier check.
#
# Runs on every pull request that touches charts/, and on main so a merge that
# skipped review is still checked. Nothing here publishes anything.
name: lint-test

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'
      - 'ct.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'
      - 'ct.yaml'

permissions: {}

env:
  HELM_DOCS_VERSION: '1.14.2'
  HELM_DOCS_SHA256: 'a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ct compares against the target branch, so it needs full history.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # On a pull request, ct runs in changed-charts mode: that is what enables
      # its check-version-increment rule, so a chart edit without a Chart.yaml
      # bump fails here rather than only at the release guard on main.
      # On a push to main there is nothing to diff against, so lint everything.
      - name: ct lint
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ct lint --config ct.yaml
          else
            ct lint --config ct.yaml --all
          fi

      - name: Chart render checks
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            chart="${chart%/}"
            if [ -f "$chart/tests/render-check.sh" ]; then
              echo "::group::render checks for $chart"
              bash "$chart/tests/render-check.sh" "$chart"
              echo "::endgroup::"
            else
              echo "no render checks for $chart"
            fi
          done

      - name: Render the examples
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            chart="${chart%/}"
            for example in "$chart"/examples/*.yaml; do
              [ -e "$example" ] || continue
              echo "rendering $example"
              helm template t "$chart" -f "$example" > /tmp/example.yaml
              test -s /tmp/example.yaml
              grep -q 'kind: StatefulSet' /tmp/example.yaml
            done
          done

      - name: Install helm-docs
        run: |
          set -euo pipefail
          url="https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL "$url" -o /tmp/helm-docs.tar.gz
          echo "${HELM_DOCS_SHA256}  /tmp/helm-docs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      - name: helm-docs is in sync with values.yaml
        run: |
          set -euo pipefail
          helm-docs --chart-search-root charts
          if ! git diff --exit-code -- charts; then
            echo "::error::charts/*/README.md is out of date. Run 'helm-docs --chart-search-root charts' and commit the result."
            exit 1
          fi

      - name: Identifier check
        run: |
          set -euo pipefail
          # Pattern list lives here, in the gate, not in a file the scrub could
          # miss (open-source-publishing.md section 9). render-check.sh is the
          # one exclusion: it carries these same literals because it runs the
          # identical check locally.
          if grep -rniE "pkg\.dev|gcr\.io|gitlab\.com|@neomanex\.com" charts/ --exclude=render-check.sh; then
            echo "::error::deployment-specific identifiers found in charts/ (hits above)"
            exit 1
          fi
          echo "identifier check clean"

          # Published text uses plain punctuation only, so no em dash anywhere
          # in the chart. The character is built with printf so this file stays
          # free of it and can be scanned by the same rule.
          em_dash="$(printf '\u2014')"
          if grep -rn "$em_dash" charts/; then
            echo "::error::em dash found in charts/ (hits above). Use a period, comma, colon or parentheses."
            exit 1
          fi
          echo "punctuation check clean"

          # Comments must explain themselves. A reference to a documentation
          # tree that ships elsewhere is meaningless to a chart user.
          if grep -rn "documentation/" charts/ --exclude=render-check.sh; then
            echo "::error::reference to an external documentation path found in charts/ (hits above). Rewrite the comment so it stands on its own."
            exit 1
          fi
          echo "internal path check clean"
