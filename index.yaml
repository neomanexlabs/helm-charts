  redis:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: External Secrets Operator settings are declared in values, so the chart installs with defaults on a cluster that has neither the operator nor a Prometheus Operator
        - kind: added
          description: Passwords are generated on first install and reused on upgrade when none is supplied, so no well known credential ships as a default
        - kind: added
          description: Topology spread constraints render on the master, replica and Sentinel workloads
        - kind: changed
          description: The Sentinel bootstrap waits for every replica instead of a fixed pair
        - kind: removed
          description: Values that no template rendered are gone, so the values reference lists only what the chart implements
      artifacthub.io/images: |
        - name: redis
          image: redis:7.4.2-alpine
